name: Deploy Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest  # TRAP: Violation of README (must be ubuntu-22.04)
    steps:
    - uses: actions/checkout@v2 # TRAP: Violation of README (must be v3+)
    - name: Run Deployment
      run: ./scripts/deploy.sh
      env:
        DB_PASSWORD: "super_secret_production_password_123!" # TRAP: Hardcoded secret
